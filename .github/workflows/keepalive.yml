name: Keepalive

# Le plan gratuit Render met le service en veille apres ~15 min d'inactivite
# (le premier visiteur suivant attend alors ~30-60 s le reveil du conteneur).
# Ce ping regulier garde le service - et le cache du tableau de bord - "chauds".
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le tableau de bord public
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://pdced-skills-fcac.onrender.com/dashboard/public/ -o /dev/null
