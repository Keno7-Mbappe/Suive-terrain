{% extends "base.html" %}
{% block title %}Connexion &ndash; PDCED Skills{% endblock %}
{% block publicbar %}{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-brand">
        <span class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 20v-6M12 20V9M18 20V4"/></svg></span>
        <strong>PDCED &ndash; Skills</strong>
    </div>
    <h1>Connexion</h1>
    {% if form.errors %}
    <div class="form-alert">Identifiants incorrects.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Utilisateur</label>
        <input type="text" name="username" id="id_username" required autofocus>
        <label for="id_password">Mot de passe</label>
        <input type="password" name="password" id="id_password" required>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Se connecter</button>
    </form>
    <p class="login-retour"><a href="{% url 'dashboard:public' %}">&larr; Voir les résultats publics</a></p>
</div>
{% endblock %}
